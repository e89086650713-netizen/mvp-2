function tlHome(){const G=[['Геометрия и материалы',['wall','geo','glue','cross','reveal','boxes','holes']],['Раскладка',['num','corner','fix','thr','gap']],['Гидроизоляция и сушка',['hyd','dry']],['Объект и материалы',['qr','rate','l3d']]];
 return`<div class="c2-hero"><h2>Плитка</h2><p>Калькуляторы, схемы и контроль укладки. Значения расхода и сроки ориентировочные: сверяйтесь с инструкцией производителя.</p></div>`+G.map(([t,a])=>`<div class="c2-sec">${t}</div><div class="c2-tiles">${a.map(k=>`<button class="c2-tile" data-tl="sec" data-v="${k}" style="--tc:${TLCOL[k]}"><span class="ti"><svg viewBox="0 0 24 24">${TLI[k]}</svg></span><b>${TLS[k][0]}</b><small>${TLS[k][1]}</small></button>`).join('')}</div>`).join('')+`<div class="c2-sec">Уже есть в системе</div><div class="card"><p class="mu" style="margin:0">Учёт инструмента с выдачей и возвратом, QR-коды инструмента и список расходников к пополнению — на вкладке «Склад» (разделы «Мой склад», «Сервис», «Закупки»).</p></div>`}
const tH=(s,f,r)=>`<div class="card"><h3>${TLS[s][0]}</h3>${f}</div><div id="tl-res">${r()}</div>`;
function tlSec(s){const R=tcr(),T=tTile(R);if(s=='wall')return tlWall(R,T);
 if(s=='geo')return tH(s,trsel()+tfld('tol','Допуск разности диагоналей, мм',5)+'<div class="c2-sh" style="margin-top:14px"><h3 style="margin:0">Создать помещение Г- или П-образной формы</h3></div>'+tsel('shape','Форма',[['L','Г-образная'],['U','П-образная']],'L')+`<div class="g2">${tfld('gsw','Ширина общая, м',5)}${tfld('gsl','Длина общая, м',4)}${tfld('gnw','Ширина выреза, м',2)}${tfld('gnl','Глубина выреза, м',2)}</div><div class="row"><button class="pri" data-tl="mkroom">Создать помещение</button></div>`,()=>{if(!R)return'';const dg=tDiag(R),n=R.pts.length;let h='<div class="card"><h3>Результат: '+esc(R.name)+'</h3>';if(n==4){const d1=dg[0].d,d2=dg[1].d,df=Math.abs(d1-d2)*1000,ok=df<=tv('tol',5);h+=`<div class="c2-kv"><div><span>Диагональ 1</span><b>${f2(d1)} м</b></div><div><span>Диагональ 2</span><b>${f2(d2)} м</b></div><div><span>Разность</span><b style="color:${ok?'#2ee6a6':'#ff8d8d'}">${Math.round(df)} мм</b></div></div><p class="mu">${ok?'Геометрия в допуске: помещение прямоугольное.':'Разность больше допуска: углы не прямые. Проверьте и скорректируйте стартовую линию укладки.'}</p>`}else h+=`<p class="mu">Диагонали между вершинами (${dg.length}):</p>`+dg.slice(0,14).map(x=>`<div class="c2-rl"><span style="flex:1">Угол ${x.i+1} — угол ${x.j+1}</span><b>${f2(x.d)} м</b></div>`).join('');return h+'</div>'});
 if(!R&&!['geo','glue','cross','fix','dry','qr','rate','l3d','boxes','reveal','holes','thr'].includes(s))return`<div class="card">${trsel()}</div>`;
 if(s=='glue'){const a0=R?area(R.pts):10;return tH(s,(R?trsel():'')+tfld('ga','Площадь, м²',+a0.toFixed(2))+tsel('gn','Зубец шпателя, мм',[[4,'4'],[6,'6'],[8,'8'],[10,'10'],[12,'12']],8)+`<div class="g2">${tfld('gl','Слой, мм (0 — по зубцу)',0)}${tfld('gd','Плотность, кг/дм³',1.5)}${tfld('gr','Запас, %',10)}${tfld('gb','Мешок, кг',25)}</div><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" data-tx="gdbl" data-chk ${TL.f.gdbl?'checked':''} style="width:20px;height:20px">Двойное нанесение (крупный формат), +30%</label>`,()=>{const g=tGlue(tv('ga',a0),tv('gn',8),tv('gl',0),tv('gd',1.5),tv('gr',10),tv('gb',25),TL.f.gdbl);return`<div class="card"><div class="c2-kpi"><div><b>${f1(g.kg)} кг</b><span>клея нужно</span></div><div><b>${g.bags}</b><span>мешков</span></div><div><b>${f2(g.per)}</b><span>кг/м²</span></div></div><p class="mu">Слой ${f2(g.L)} мм.</p><div class="row"><button class="pri" data-tl="buy" data-n="Плиточный клей, мешок ${tv('gb',25)} кг" data-q="${g.bags}" data-u="шт.">В закупки</button></div></div>`})}
 if(s=='cross'){const a0=R?area(R.pts):10;return tH(s,(R?trsel():'')+tfld('ca','Площадь, м²',+a0.toFixed(2))+`<div class="g2">${tfld('cw','Плитка, ширина мм',T.w)}${tfld('cl','Длина, мм',T.h)}${tfld('cg','Шов, мм',T.g)}${tfld('cs','Число швов (пересечений), 0 — авто',0)}</div>`,()=>{const c=tCross(tv('ca',a0),tv('cw',T.w),tv('cl',T.h),tv('cg',T.g),tv('cs',0));return`<div class="card"><div class="c2-kpi"><div><b>${c.n}</b><span>плиток (с запасом 10%)</span></div><div><b>${c.cr}</b><span>крестиков</span></div><div><b>${c.cl}</b><span>СВП-зажимов</span></div></div><div class="c2-kpi"><div><b>${c.wd}</b><span>клиньев</span></div></div><p class="mu">Зажимы ставятся не реже чем через 300 мм по шву. Количество приблизительное.</p><div class="row"><button data-tl="buy" data-n="Крестики для плитки ${tv('cg',T.g)} мм" data-q="${c.cr}" data-u="шт.">Крестики в закупки</button><button data-tl="buy" data-n="СВП зажимы" data-q="${c.cl}" data-u="шт.">СВП</button><button data-tl="buy" data-n="СВП клинья" data-q="${c.wd}" data-u="шт.">Клинья</button></div></div>`})}
 if(s=='reveal'){return tH(s,tfld('rd','Глубина откоса, мм',150)+`<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" data-tx="rsill" data-chk ${TL.f.rsill?'checked':''} style="width:20px;height:20px">Подоконник отдельно (нижний откос не считать)</label>`,()=>{const o=tOpen(),d=tv('rd',150)/1000;let s2=0;return`<div class="card"><h3>Проёмы проекта</h3>${o.map(x=>{const a=tReveal(x,d,TL.f.rsill);s2+=a;return`<div class="ln"><div class="lt">${esc(x.r)} · ${x.t=='d'?'дверь':'окно'} ${f2(x.w)}×${f2(x.h)} м</div><div class="ls">${tm2(a)}</div></div>`}).join('')||'<p class="mu">Двери и окна не добавлены на плане.</p>'}<div class="sub"><span>Итого откосов</span><b>${tm2(s2)}</b></div></div>`})}
 if(s=='boxes'){const B=TL.boxes.filter(b=>b.k!='hole');return tH(s,tsel('bk','Тип',[['box','Короб'],['niche','Ниша']],'box')+`<div class="g2">${tfld('ba','Ширина, мм',300)}${tfld('bb2','Высота, мм',300)}${tfld('bc','Длина / глубина, мм',2000)}</div><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" data-tx="bends" data-chk ${TL.f.bends?'checked':''} style="width:20px;height:20px">Торцы короба тоже отделываются</label><div class="row"><button class="pri" data-tl="addbox">Добавить</button></div>`,()=>{const tot=B.reduce((x,b)=>x+b.a,0);return`<div class="card"><h3>Список</h3>${B.map(b=>`<div class="c2-rl"><div style="flex:1"><b>${b.t}</b><div class="mu" style="margin:2px 0 0">${b.w}×${b.h}×${b.l} мм</div></div><b>${tm2(b.a)}</b><button class="x c2-ib" data-tl="delbox" data-id="${b.id}">✕</button></div>`).join('')||'<p class="mu">Пока пусто.</p>'}<div class="sub"><span>Итого площадь отделки</span><b>${tm2(tot)}</b></div></div>`})}
 if(s=='holes'){return tH(s,`<p class="mu" style="margin:0">Отверстия считаются по приборам, которые вы поставили на плане, плюс ваши дополнительные.</p><div class="g2">${tfld('hd','Диаметр, мм',50)}${tfld('hc','Кол-во',1)}</div><div class="row"><button data-tl="addhole">Добавить отверстие</button></div>`,()=>{const m=tHoles(),H=TL.boxes.filter(b=>b.k=='hole');return`<div class="card"><h3>Приборы на плане</h3>${S.mep.map(x=>`<div class="ln"><div class="lt">${MT[x.t]?MT[x.t][1]:x.t}</div><div class="ls">${(THOLE[x.t]||[]).map(([d,c])=>c+'×Ø'+d).join(', ')||'по месту'}</div></div>`).join('')||'<p class="mu">Приборов на плане нет.</p>'}${H.map(h=>`<div class="c2-rl"><span style="flex:1">Своё: Ø${h.d} мм ×${h.c}</span><button class="x c2-ib" data-tl="delbox" data-id="${h.id}">✕</button></div>`).join('')}<div class="sub"><span>Всего коронок и свёрл</span><b>${Object.entries(m).map(([d,c])=>c+'×Ø'+d).join(', ')||'—'}</b></div></div>`})}
 if(s=='num'){return tH(s,trsel()+`<div class="g2">${tfld('nw','Плитка, ширина мм',T.w)}${tfld('nh','Длина, мм',T.h)}${tfld('ng','Шов, мм',T.g)}</div><div class="g2">${tsel('nc','Начать с угла',[['tl','левый верхний'],['tr','правый верхний'],['bl','левый нижний'],['br','правый нижний']],'tl')}${tsel('ns','Порядок',[['0','рядами'],['1','змейкой']],'0')}</div>`,()=>{if(!R)return'';const o=tTiles(R,tv('nw',T.w),tv('nh',T.h),tv('ng',T.g),TL.f.nc||'tl',TL.f.ns=='1');if(!o)return'<div class="card"><p class="mu">Слишком много плиток для схемы (более 1800). Увеличьте формат.</p></div>';const b=bb([R]),w=tv('nw',T.w)/1000,h=tv('nh',T.h)/1000,fs=Math.min(w,h)*.38;return`<div class="card"><svg viewBox="${b.x-.2} ${b.y-.2} ${b.w+.4} ${b.h+.4}" style="width:100%;height:auto;max-height:70vh;background:#0a2f57;border-radius:10px">${o.T.map(t=>`<rect x="${t.x}" y="${t.y}" width="${w}" height="${h}" fill="${t.cut?'#ffb347':'#14568f'}" stroke="#9fd8ff" stroke-width="${Math.min(w,h)*.03}"/><text x="${t.x+w/2}" y="${t.y+h/2+fs*.35}" font-size="${fs}" fill="${t.cut?'#2a1800':'#fff'}" text-anchor="middle" font-family="Arial" font-weight="700">${t.n}</text>`).join('')}<polygon points="${R.pts.map(q=>q.join(',')).join(' ')}" fill="none" stroke="#fff" stroke-width=".05"/></svg><p class="mu">Плиток: ${o.T.length}, из них с подрезкой (оранжевые): ${o.T.filter(t=>t.cut).length}. Номера идут по порядку укладки.</p></div>`})}
 if(s=='corner'){const n=R.pts.length;return tH(s,trsel()+`<div class="g2">${tsel('ka','Стена A (к углу)',R.pts.map((_,i)=>[i,'Стена '+(i+1)]),0)}${tfld('kw','Плитка, ширина мм',T.w)}${tfld('kg','Шов, мм',T.g)}</div><p class="mu">Стена B — следующая по часовой стрелке (соседняя через внутренний угол).</p>`,()=>{const a=+(TL.f.ka||0)%n,b=(a+1)%n,p=tv('kw',T.w)+tv('kg',T.g),LA=tEdge(R,a)*1000,LB=tEdge(R,b)*1000,rem=LA%p,wrap=rem?p-rem:0,endB=((LB-wrap)%p+p)%p,sym=x=>((x%p)+p)%p?(((x%p)+p)%p+p)/2:p;const sl=x=>x>1&&x<p*.25?' · узкая полоса, лучше сдвинуть раскладку':'';return`<div class="card"><h3>Стена ${a+1} → стена ${b+1}</h3><div class="c2-kv"><div><span>Длина A</span><b>${tmm(LA)}</b></div><div><span>Длина B</span><b>${tmm(LB)}</b></div><div><span>Остаток у угла на A</span><b>${tmm(rem)}</b></div><div><span>Продолжение рисунка на B</span><b>${tmm(wrap)}</b></div><div><span>Остаток на конце B</span><b>${tmm(endB)}</b></div></div><p class="mu">Если рисунок и швы продолжаются через угол: на стене A последняя плитка отрезается на ${tmm(rem)}, а на стене B первая плитка начинается с ${tmm(wrap)}${sl(wrap)}.</p><p class="mu">Симметричная раскладка: подрезка по краям стены A — ${tmm(sym(LA))}, стены B — ${tmm(sym(LB))}.</p><p class="mu">Совмещение рисунка: швы на соседних стенах совпадают, когда начинаете B с целой плитки и остаток на A равен нулю. Сейчас смещение швов ${tmm(rem)}.</p></div>`})}

const BLK={wall:[['Рекомендуемые работы',()=>card('Рекомендуемые работы')],['Площади по проекту',()=>card('Площади по проекту')],['Площади выбранной комнаты',()=>card('Площади отделки:')]],est:[['Площади отделки по проекту',()=>card('Площади отделки по проекту')]],stock:[['Рекомендуем докупить',()=>card('Рекомендуем докупить')],['Боковая панель',()=>$$('.sk-side')]],doc:[['Боковая панель',()=>$$('.sk-side')]]};
const SW={lay:[['Комнаты','[data-a="pick"]']],wall:[['Комнаты','[data-a="pick"]']],mz:[['Комнаты','[data-m^="room|"]'],['Раздел','[data-m^="sec|"]']],def:[['Комнаты','[data-df="room"]']],stock:[['Раздел','[data-sk="tab"]']],doc:[['Раздел','[data-th="tab"]']]};
const ACT={mat:['[data-a="matcopy"]','[data-a="print"]'],cmp:['[data-a="cmpcopy"]']};
const I=(t,fn,o={})=>({t,fn,...o}),SEP={sep:1},H=t=>({h:t});
const on=()=>document.body.classList.contains('hascap');
function apply(){pn.querySelectorAll('.caph').forEach(e=>e.classList.remove('caph'));if(!on())return;const t=S.tab;
 (BLK[t]||[]).forEach(([n,f])=>{if(!SHOWN.has(t+n))f().forEach(e=>e.classList.add('caph'))});
 (SW[t]||[]).forEach(([n,s])=>$$(s).forEach(b=>b.parentElement.classList.add('caph')));
 (ACT[t]||[]).forEach(s=>$$(s).forEach(b=>{const r=b.closest('.row');if(r&&r.querySelectorAll('button').length==r.querySelectorAll(ACT[t].join(',')).length)r.classList.add('caph')}))}
function menus(){const t=S.tab,m=[],nm=(NV.find(x=>x[0]==t)||[0,''])[1];
 m.push(['lg',[I('О программе «Смета отделки»',()=>toast('Смета отделки · режим «Кап»','info')),SEP,I('Главная',()=>goTab('home')),I('Новый проект',()=>clk('[data-a="pnew"]')),SEP,I('Командная строка…',()=>clk('#cmdb'),{k:'Ctrl K'}),I('Светлая / тёмная тема',toggleTheme,{k:'T'})]]);
 m.push(['ap',[H('Разделы'),...NV.map(([k,n])=>I(n,()=>goTab(k),{ck:k==t}))],nm]);
 if(CV.includes(t)){m.push(['nav',[I('Скрыть / показать панели',togglePanels,{k:'H',ck:document.body.classList.contains('nopan')}),I('Меню действий…',()=>{const b=cap.querySelector('[data-m="nav"]');openMenu(b);const u=document.getElementById('umenu');if(u)u.style.top=(b.getBoundingClientRect().bottom+4)+'px'},{k:'M'})],'Навигация']);
  m.push(['view',[I('Размеры и площади',()=>clk('#dimw [data-a="dims"]'),{ck:!!S.dm}),I('Слои…',()=>clk('.zb [data-a="lyr"]'),{k:'L'}),I('3D и развёртка',()=>clk('.zb [data-a="v3"]'),{k:'3'}),SEP,I('Вписать план',()=>clk('.zb [data-a="zf"]'),{k:'0'}),I('Приблизить',()=>clk('.zb [data-a="zi"]'),{k:'+'}),I('Отдалить',()=>clk('.zb [data-a="zo"]'),{k:'−'}),...(BLK[t]?[SEP,H('Показать блоки'),...BLK[t].map(([n])=>I(n,()=>{SHOWN.has(t+n)?SHOWN.delete(t+n):SHOWN.add(t+n);apply()},{ck:SHOWN.has(t+n)}))]:[])],'Вид']);}
 else if(BLK[t])m.push(['view',BLK[t].map(([n])=>I(n,()=>{SHOWN.has(t+n)?SHOWN.delete(t+n):SHOWN.add(t+n);apply()},{ck:SHOWN.has(t+n)})),'Вид']);
 (SW[t]||[]).forEach(([n,s])=>{const bs=$$(s);if(bs.length)m.push(['sw'+n,bs.map(b=>I(b.textContent.trim(),()=>b.click(),{ck:b.classList.contains('on')})),n])});
 if(ACT[t]){const it=ACT[t].map(s=>$$(s)[0]).filter(Boolean).map(b=>I(b.textContent.trim(),()=>b.click()));if(it.length)m.push(['file',it,'Файл'])}
 return m}
let MS=[];
function build(){MS=menus();cap.innerHTML=MS.map(([k,,n],i)=>`<button data-m="${k}" data-i="${i}" class="${k=='lg'?'lg':k=='ap'?'ap':''}">${k=='lg'?'<svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>':n}</button>`).join('')+'<span class="sp"></span><button data-m="srch" title="Поиск и команды"><svg viewBox="0 0 24 24" style="width:15px;height:15px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;vertical-align:-3px"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button><span id="capclk"></span>';clock()}
function clock(){const e=document.getElementById('capclk');if(e){const d=new Date();e.textContent=d.toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'short'})+' '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}}
function close(){mm.hidden=true;cap.querySelectorAll('.open').forEach(b=>b.classList.remove('open'))}
function open(btn){const i=+btn.dataset.i;MS=menus();const it=(MS[i]||[])[1];if(!it)return;cap.querySelectorAll('.open').forEach(b=>b.classList.remove('open'));btn.classList.add('open');
 mm.innerHTML=it.map((x,j)=>x.sep?'<hr>':x.h?`<div class="h">${x.h}</div>`:`<div class="i ${x.ck?'ck':''}" data-j="${j}">${x.t}${x.k?`<kbd>${x.k}</kbd>`:''}</div>`).join('');mm.hidden=false;mm._it=it;mm.style.top=cap.offsetHeight+2+'px';mm.style.left=Math.min(btn.getBoundingClientRect().left,innerWidth-mm.offsetWidth-8)+'px'}
cap.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.m=='srch'){close();return clk('#cmdb')}if(b.classList.contains('open'))return close();open(b)});
cap.addEventListener('mouseover',e=>{const b=e.target.closest('button[data-i]');if(b&&!mm.hidden&&!b.classList.contains('open'))open(b)});
mm.addEventListener('click',e=>{const d=e.target.closest('.i');if(!d)return;const x=mm._it[+d.dataset.j];close();x&&x.fn&&x.fn()});
document.addEventListener('mousedown',e=>{if(!e.target.closest('#cap,#capm'))close()});
document.addEventListener('keydown',e=>{if(e.key=='Escape')close()},true);
let last=null;
function sync(){const v=innerWidth>=900&&S.tab!='home';document.body.classList.toggle('hascap',v);last=S.tab;close();if(v)build();apply()}
const _r=render;render=function(){const r=_r.apply(this,arguments);sync();return r};
new MutationObserver(()=>{if(last!==S.tab)sync();else apply()}).observe(pn,{childList:true,subtree:true});
addEventListener('resize',()=>{if(on()!=(innerWidth>=900&&S.tab!='home'))sync()});
setInterval(clock,20000);sync();
}catch(e){console.error('cap',e)}})();
</script>
</body></html>
