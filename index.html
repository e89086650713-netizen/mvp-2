function hmNrm(r,i){const a=r.pts[i],b=r.pts[(i+1)%r.pts.length],L=Math.hypot(b[0]-a[0],b[1]-a[1])||1,u=[(b[0]-a[0])/L,(b[1]-a[1])/L];let n=[-u[1],u[0]];if(!inPoly(r.pts,(a[0]+b[0])/2+n[0]*.05,(a[1]+b[1])/2+n[1]*.05))n=[-n[0],-n[1]];return{a,u,n,L}}

function hmPlan(r,d){const b=bb([r]),fs=Math.max(b.w,b.h)/28,its=d.hm.filter(x=>x.r==r.id);let g=`<polygon points="${P(r.pts)}" fill="#14568f" fill-opacity=".35" stroke="#7fd4ff" stroke-width="${fs*.15}"/>`;

  Q.forEach(q=>g+=`<circle cx="${q[0]}" cy="${q[1]}" r="${fs*.5}" fill="${c}" stroke="#061a2d" stroke-width="${fs*.14}"/>`);
  if(sel)x.pts.forEach((p,k)=>{const w=Math.min(+p.w||0,r.pts.length-1),N=hmNrm(r,w),f=[N.a[0]+N.u[0]*p.s/1000,N.a[1]+N.u[1]*p.s/1000],q=Q[k],T=(ax,ay,tx)=>`<text x="${ax}" y="${ay}" font-size="${fs*.8}" fill="#fff" text-anchor="middle" paint-order="stroke" stroke="#081a2c" stroke-width="${fs*.22}">${tx}</text>`;
   g+=`<line x1="${N.a[0]}" y1="${N.a[1]}" x2="${f[0]}" y2="${f[1]}" stroke="#ffcf70" stroke-width="${fs*.1}" stroke-dasharray="${fs*.3} ${fs*.2}"/>`+T((N.a[0]+f[0])/2+N.n[0]*fs*.9,(N.a[1]+f[1])/2+N.n[1]*fs*.9,Math.round(p.s)+' мм');

 return`<svg viewBox="${b.x-fs*2} ${b.y-fs*2} ${b.w+fs*4} ${b.h+fs*4}" style="width:100%;height:auto;max-height:60vh;background:#0a2540;border-radius:10px;margin-top:8px">${g}</svg>`}

 (r.op||[]).filter(o=>o.e==i).forEach(o=>{const z=o.t=='w'?(o.z!=null?o.z:.9):0;g+=`<rect x="${o.p*L-o.w/2}" y="${H-z-o.h}" width="${o.w}" height="${o.h}" fill="${o.t=='w'?'#9fd8ff':'#6b4f2c'}" fill-opacity=".6" stroke="#0a2540" stroke-width="${fs*.1}"/>`});
 const XY=p=>[(p.s||0)/1000,H-(p.v||0)/1000];
 d.hm.filter(x=>x.r==r.id&&x.g=='w'&&x.pts.some(p=>p.w==i)).forEach(x=>{const c=hcol(x),sel=x.id==MZ.hs,P=x.pts.filter(p=>p.w==i);
  if(x.pts.length>1&&P.length==x.pts.length){const a=XY(P[0]),b=XY(P[1]);g+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${c}" stroke-width="${fs*(sel?.3:.2)}" stroke-linecap="round"/>`}

 m.push(['ap',[H('Разделы'),...(window.NVX||NV).map(([k,n])=>I(n,()=>goTab(k),{ck:k==t}))],nm]);
 if(CV.includes(t)){m.push(['nav',[I('Скрыть / показать панели',togglePanels,{k:'H',ck:document.body.classList.contains('nopan')}),I('Меню действий…',()=>{const b=cap.querySelector('[data-m="nav"]');openMenu(b);const u=document.getElementById('umenu');if(u)u.style.top=(b.getBoundingClientRect().bottom+4)+'px'},{k:'M'})],'Навигация']);
  m.push(['view',[I('Размеры и площади',()=>clk('#dimw [data-a="dims"]'),{ck:!!S.dm}),I('Слои…',()=>clk('.zb [data-a="lyr"]'),{k:'L'}),I('3D и развёртка',()=>clk('.zb [data-a="v3"]'),{k:'3'}),SEP,I('Вписать план',()=>clk('.zb [data-a="zf"]'),{k:'0'}),I('Приблизить',()=>clk('.zb [data-a="zi"]'),{k:'+'}),I('Отдалить',()=>clk('.zb [data-a="zo"]'),{k:'−'}),...(BLK[t]?[SEP,H('Показать блоки'),...BLK[t].map(([n])=>I(n,()=>{SHOWN.has(t+n)?SHOWN.delete(t+n):SHOWN.add(t+n);apply()},{ck:SHOWN.has(t+n)}))]:[])],'Вид']);}
 else if(BLK[t])m.push(['view',BLK[t].map(([n])=>I(n,()=>{SHOWN.has(t+n)?SHOWN.delete(t+n):SHOWN.add(t+n);apply()},{ck:SHOWN.has(t+n)})),'Вид']);
 (SW[t]||[]).forEach(([n,s])=>{const bs=$$(s);if(bs.length)m.push(['sw'+n,bs.map(b=>I(b.textContent.trim(),()=>b.click(),{ck:b.classList.contains('on')})),n])});
